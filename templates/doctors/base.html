{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Doctors · Clinic{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'doctors/directory.css' %}">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="{% url 'doctors:list' %}">Clinic</a>
    <nav>
      <a href="{% url 'doctors:list' %}">Doctors</a>
      <a href="{% url 'voice:assistant' %}">Voice booking</a>
      <a href="/admin/">Staff admin</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
